<!DOCTYPE html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Chess Arena</title><style>*{box-sizing:border-box}body{margin:0;background:#181b20;color:#eee;font:16px system-ui}header{padding:20px 5%;font-size:25px;font-weight:800;border-bottom:1px solid #333}header span{color:#a4cf72}main{max-width:1100px;margin:24px auto;display:grid;grid-template-columns:minmax(0,650px) 320px;gap:24px;padding:12px}.board{display:grid;grid-template-columns:repeat(8,1fr);border-radius:5px;overflow:hidden}.sq{aspect-ratio:1;position:relative;display:grid;place-items:center;cursor:pointer;font-size:clamp(24px,7vw,65px);user-select:none}.light{background:#ebecd0}.dark{background:#779556}.selected,.last{box-shadow:inset 0 0 0 100px #e9db4555}.dot:after{content:'';position:absolute;width:27%;height:27%;background:#152a3060;border-radius:50%}.capture:after{content:'';position:absolute;inset:4%;border:5px solid #152a3060;border-radius:50%}.sq img{width:88%;height:88%;pointer-events:none}.coord{position:absolute;font-size:11px;font-weight:bold;left:3px;top:2px;color:#34432d}.player{display:flex;justify-content:space-between;padding:12px 0;font-weight:700}.panel{background:#252930;padding:20px;border-radius:14px}h2{margin:0 0 18px}label{display:block;margin:15px 0 7px;color:#bfc4ce}input,select,button{font:inherit}input[type=range]{width:100%;accent-color:#a4cf72}select,button{background:#363c45;color:white;border:0;border-radius:8px;padding:12px;width:100%;cursor:pointer}button:hover{filter:brightness(1.2)}.primary{background:#87b65b;color:#17220f;font-weight:800;margin:15px 0}.buttons{display:grid;grid-template-columns:1fr 1fr;gap:8px}.moves{height:170px;overflow:auto;background:#1c2026;border-radius:8px;padding:10px;line-height:1.8;white-space:pre-wrap}#status{padding:12px;background:#363c45;border-radius:8px;margin:12px 0}small{color:#aeb6c3}dialog{background:#252930;color:white;border:0;border-radius:12px}dialog button{margin:4px;width:auto}@media(max-width:760px){main{grid-template-columns:1fr;margin:0 auto;gap:12px}.sq{font-size:9vw}}</style></head><body><header>♞ Chess <span>Arena</span></header><main><section><div class="player"><span id="top">🤖 Computer</span><span id="capTop"></span></div><div class="board" id="board"></div><div class="player"><span id="bottom">👤 You</span><span id="capBottom"></span></div><div id="status">Loading chess engine…</div></section><aside class="panel"><h2>Play vs Computer</h2><label>Bot rating: <strong id="rating">1200</strong></label><input id="elo" type="range" min="100" max="3000" step="100" value="1200"><small id="level">Intermediate</small><label>Play as</label><select id="color"><option value="w">White</option><option value="b">Black</option><option value="random">Random</option></select><button class="primary" id="new">New game</button><div class="buttons"><button id="undo">↶ Undo</button><button id="flip">⇅ Flip</button><button id="hint">💡 Hint</button><button id="resign">Resign</button></div><label>Move history</label><div class="moves" id="moves"></div><label>About difficulty</label><small>Ratings are approximate. Lower levels make more mistakes; higher levels search deeper. The engine runs offline. Ratings are approximate.</small></aside></main><dialog id="promotion"><h3>Promote pawn</h3><div id="choices"></div></dialog><script>class Chess{constructor(){this.reset()}reset(){this.b=Array(128).fill('.');['rnbqkbnr','pppppppp','........','........','........','........','PPPPPPPP','RNBQKBNR'].forEach((r,i)=>[...r].forEach((p,j)=>this.b[i*16+j]=p));this.t='w';this.c=15;this.ep=-1;this.half=0;this.h=[];this.keys=[this.key()]}key(){return this.b.join('')+this.t+this.c+this.ep}idx(s){return (8-Number(s[1]))*16+'abcdefgh'.indexOf(s[0])}sq(i){return 'abcdefgh'[i&7]+(8-(i>>4))}on(i){return i>=0&&i<128&&!(i&136)}side(p){return p==='.'?null:p===p.toUpperCase()?'w':'b'}opp(c){return c==='w'?'b':'w'}get(s){let p=this.b[this.idx(s)];return p&&p!=='.'?{type:p.toLowerCase(),color:this.side(p)}:null}turn(){return this.t}board(){return Array.from({length:8},(_,r)=>Array.from({length:8},(_,c)=>this.get(this.sq(r*16+c))))}dirs(p){return {n:[-33,-31,-18,-14,14,18,31,33],b:[-17,-15,15,17],r:[-16,-1,1,16],q:[-17,-16,-15,-1,1,15,16,17],k:[-17,-16,-15,-1,1,15,16,17]}[p]}att(i,c){for(let f=0;f<128;f++){if(!this.on(f)||this.side(this.b[f])!==c)continue;let p=this.b[f].toLowerCase();if(p==='p'){let d=c==='w'?-16:16;if(i===f+d-1||i===f+d+1)return true;continue}for(let d of this.dirs(p))for(let t=f+d;this.on(t);t+=d){if(t===i)return true;if(this.b[t]!=='.'||p==='n'||p==='k')break}}return false}check(c){return this.att(this.b.indexOf(c==='w'?'K':'k'),this.opp(c))}in_check(){return this.check(this.t)}raw(){let out=[],c=this.t,d=c==='w'?-16:16;for(let f=0;f<128;f++){if(!this.on(f)||this.side(this.b[f])!==c)continue;let p=this.b[f].toLowerCase(),add=(t,flag='')=>{if(this.b[t].toLowerCase()==='k')return;for(let promotion of p==='p'&&[0,7].includes(t>>4)?['q','r','b','n']:[undefined])out.push({from:this.sq(f),to:this.sq(t),piece:p,color:c,captured:flag==='ep'?'p':this.b[t]==='.'?undefined:this.b[t].toLowerCase(),promotion,flag})};if(p==='p'){let t=f+d;if(this.on(t)&&this.b[t]==='.'){add(t);if((f>>4)===(c==='w'?6:1)&&this.b[t+d]==='.')add(t+d)}for(let t of [f+d-1,f+d+1])if(this.on(t)){if(this.side(this.b[t])===this.opp(c))add(t);else if(t===this.ep)add(t,'ep')}}else{for(let d of this.dirs(p))for(let t=f+d;this.on(t);t+=d){if(this.side(this.b[t])===c)break;add(t);if(this.b[t]!=='.'||p==='k'||p==='n')break}if(p==='k'&&f===(c==='w'?116:4)&&!this.check(c)){let bits=c==='w'?[1,2]:[4,8],r=c==='w'?'R':'r',o=this.opp(c);if(this.c&bits[0]&&this.b[f+3]===r&&this.b[f+1]==='.'&&this.b[f+2]==='.'&&!this.att(f+1,o)&&!this.att(f+2,o))add(f+2,'castle');if(this.c&bits[1]&&this.b[f-4]===r&&[1,2,3].every(n=>this.b[f-n]==='.')&&!this.att(f-1,o)&&!this.att(f-2,o))add(f-2,'castle')}}}return out}push(m){let f=this.idx(m.from),t=this.idx(m.to),p=this.b[f],d=this.t==='w'?-16:16;this.h.push({b:this.b.slice(),t:this.t,c:this.c,ep:this.ep,half:this.half,m});this.b[f]='.';this.b[t]=m.promotion?(this.t==='w'?m.promotion.toUpperCase():m.promotion):p;if(m.flag==='ep')this.b[t-d]='.';if(m.flag==='castle'){let a=t>f?f+3:f-4,z=t>f?f+1:f-1;this.b[z]=this.b[a];this.b[a]='.'}if(p==='K')this.c&=~3;if(p==='k')this.c&=~12;let bits={119:1,112:2,7:4,0:8};this.c&=~((bits[f]||0)|(bits[t]||0));this.ep=m.piece==='p'&&Math.abs(t-f)===32?(t+f)/2:-1;this.half=m.piece==='p'||m.captured?0:this.half+1;this.t=this.opp(this.t);this.keys.push(this.key());return m}undo(){let s=this.h.pop();if(!s)return null;this.keys.pop();Object.assign(this,{b:s.b,t:s.t,c:s.c,ep:s.ep,half:s.half});return s.m}moves(o={}){let c=this.t;return this.raw().filter(m=>{if(o.square&&m.from!==o.square)return false;this.push(m);let ok=!this.check(c);this.undo();return ok})}move(m){let x=m.flag!==undefined?m:this.moves().find(x=>x.from===m.from&&x.to===m.to&&(!x.promotion||x.promotion===m.promotion));if(!x)return null;x.san=x.flag==='castle'?(x.to[0]==='g'?'O-O':'O-O-O'):(x.piece==='p'?(x.captured?x.from[0]:''):x.piece.toUpperCase())+(x.captured?'x':'')+x.to+(x.promotion?'='+x.promotion.toUpperCase():'');this.push(x);return x}history(o={}){return this.h.map(s=>o.verbose?s.m:s.m.san)}in_checkmate(){return this.in_check()&&!this.moves().length}in_stalemate(){return !this.in_check()&&!this.moves().length}in_threefold_repetition(){return this.keys.filter(k=>k===this.key()).length>=3}insufficient_material(){let p=this.b.filter(x=>!['.','k','K'].includes(x));return !p.length||p.length===1&&/[bn]/i.test(p[0])||p.every(x=>/b/i.test(x))&&new Set(this.b.map((x,i)=>/b/i.test(x)?((i>>4)+(i&7))%2:null).filter(x=>x!==null)).size===1}in_draw(){return this.half>=100||this.in_stalemate()||this.in_threefold_repetition()||this.insufficient_material()}game_over(){return this.in_checkmate()||this.in_draw()}}
</script><script>
const $=id=>document.getElementById(id);if(typeof Chess==='undefined'){$('status').textContent='Could not load chess rules. Check internet and reload.';throw Error('Chess library unavailable')}
let game=new Chess(),human='w',flipped=false,selected=null,last=null,busy=false,over=false,token=0,hint=null;const files='abcdefgh',values={p:100,n:320,b:330,r:500,q:900,k:0};const symbols={w:{p:'♙',n:'♘',b:'♗',r:'♖',q:'♕',k:'♔'},b:{p:'♟',n:'♞',b:'♝',r:'♜',q:'♛',k:'♚'}};
function render(){let board=$('board');board.innerHTML='';let targets=selected?game.moves({square:selected,verbose:true}):[];for(let i=0;i<64;i++){let j=flipped?63-i:i,r=7-Math.floor(j/8),c=j%8,s=files[c]+(r+1),p=game.get(s),el=document.createElement('div');el.className='sq '+((r+c)%2?'light':'dark');if(selected===s||hint?.from===s||hint?.to===s)el.classList.add('selected');if(last&&(last.from===s||last.to===s))el.classList.add('last');if(targets.some(m=>m.to===s))el.classList.add(p?'capture':'dot');if(p){let img=document.createElement('img');img.src='https://images.chesscomfiles.com/chess-themes/pieces/neo/150/'+p.color+p.type+'.png';img.alt=symbols[p.color][p.type];img.onerror=()=>{img.remove();el.append(symbols[p.color][p.type])};el.append(img)}if(i%8===0||i>=56){let t=document.createElement('span');t.className='coord';t.textContent=(i%8===0?r+1:'')+(i>=56?files[c]:'');el.append(t)}el.onclick=()=>click(s);board.append(el)}let topColor=flipped?'w':'b';$('top').textContent=topColor===human?'👤 You':'🤖 Bot · '+$('elo').value;$('bottom').textContent=topColor!==human?'👤 You':'🤖 Bot · '+$('elo').value;let hist=game.history({verbose:true});$('moves').textContent=hist.map((m,i)=>(i%2===0?Math.floor(i/2)+1+'. ':'')+m.san+(i%2?'\n':'   ')).join('');$('moves').scrollTop=$('moves').scrollHeight;let caps=c=>hist.filter(m=>m.color===c&&m.captured).map(m=>symbols[c==='w'?'b':'w'][m.captured]).join('');$('capTop').textContent=caps(topColor);$('capBottom').textContent=caps(topColor==='w'?'b':'w');$('status').textContent=over?'Game ended by resignation.':game.in_checkmate()?(game.turn()===human?'Checkmate — bot wins!':'Checkmate — you win!'):game.in_draw()?'Draw — '+(game.in_stalemate()?'stalemate':game.in_threefold_repetition()?'repetition':game.insufficient_material()?'insufficient material':'50-move rule'):busy?'Bot is thinking…':(game.turn()===human?'Your turn':'Bot to move')+(game.in_check()?' · Check!':'');}
function click(s){if(busy||over||game.game_over()||game.turn()!==human)return;let p=game.get(s);if(p&&p.color===human){selected=selected===s?null:s;render();return}if(!selected)return;let moves=game.moves({square:selected,verbose:true}).filter(m=>m.to===s);if(!moves.length){selected=null;render();return}if(moves.length>1){$('choices').innerHTML='';moves.forEach(m=>{let b=document.createElement('button');b.textContent=symbols[human][m.promotion];b.onclick=()=>{$('promotion').close();play(m)};$('choices').append(b)});$('promotion').showModal()}else play(moves[0])}
function play(m){last=game.move({from:m.from,to:m.to,promotion:m.promotion||'q'});selected=null;hint=null;render();bot()}
function evaluate(g){let score=0;g.board().forEach((row,r)=>row.forEach((p,c)=>{if(!p)return;let center=7-(Math.abs(r-3.5)+Math.abs(c-3.5)),bonus=p.type==='p'?(p.color==='w'?6-r:r-1)*9+center*3:p.type==='n'||p.type==='b'?center*10:p.type==='k'?-center*4:center*2;score+=(p.color==='w'?1:-1)*(values[p.type]+bonus)}));return score*(g.turn()==='w'?1:-1)}
let deadline;function search(g,d,a,b,ply){if(performance.now()>deadline)throw Error('time');let moves=g.moves({verbose:true});if(!moves.length)return g.in_check()?-100000+ply:0;if(d===0)return evaluate(g);moves.sort((x,y)=>order(y)-order(x));let best=-Infinity;for(let m of moves){g.move(m);let v;try{v=-search(g,d-1,-b,-a,ply+1)}finally{g.undo()}best=Math.max(best,v);a=Math.max(a,v);if(a>=b)break}return best}function order(m){return (m.captured?10*values[m.captured]-values[m.piece]:0)+(m.promotion?900:0)}
function choose(g,elo){let moves=g.moves({verbose:true});if(!moves.length)return null;if(elo<=300&&Math.random()<.75)return moves[Math.floor(Math.random()*moves.length)];let depth=elo<900?1:elo<1700?2:elo<2400?3:4;let scores=moves.map(m=>({m,v:0}));deadline=performance.now()+Math.min(2200,400+elo*.6);for(let d=1;d<=depth;d++){let next=[];try{for(let {m} of scores){g.move(m);let v;try{v=-search(g,d-1,-Infinity,Infinity,1)}finally{g.undo()}next.push({m,v})}scores=next.sort((a,b)=>b.v-a.v)}catch(e){break}}let noise=Math.max(0,(2200-elo)*.18);return scores.map(x=>({...x,v:x.v+Math.random()*noise})).sort((a,b)=>b.v-a.v)[0].m}
function bot(){if(over||game.game_over()||game.turn()===human)return;busy=true;render();let t=++token;setTimeout(()=>{if(t!==token)return;let m=choose(game,+$('elo').value);if(m)last=game.move(m);busy=false;render()},180)}
$('elo').onchange=$('elo').oninput=()=>{$('rating').textContent=$('elo').value;$('level').textContent=+$('elo').value<800?'Beginner':+$('elo').value<1600?'Intermediate':+$('elo').value<2400?'Advanced':'Expert';render()};$('new').onclick=()=>{token++;game.reset();human=$('color').value==='random'?(Math.random()<.5?'w':'b'):$('color').value;flipped=human==='b';selected=last=hint=null;busy=over=false;render();bot()};$('flip').onclick=()=>{flipped=!flipped;render()};$('undo').onclick=()=>{token++;busy=over=false;if(game.history().length){game.undo();if(game.turn()!==human&&game.history().length)game.undo()}last=game.history({verbose:true}).slice(-1)[0]||null;selected=hint=null;render();bot()};$('hint').onclick=()=>{if(!busy&&!over&&!game.game_over()&&game.turn()===human){hint=choose(game,2400);render()}};$('resign').onclick=()=>{token++;busy=false;over=true;render()};render();</script></body></html>
